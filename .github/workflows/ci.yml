name: BY SARA — Quality Gates
on:
  push:
    branches: [main, develop, phase7-integration]
  pull_request:
    branches: [main, develop, phase7-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: by-sara-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    name: Dependency-free source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:repository
      - run: npm test
  build:
    name: Lockfile, TypeScript and Next.js build
    permissions:
      contents: write
    needs: source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and prepare lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo 'Reproducible lockfile exists; npm ci.'
            npm ci --no-audit --no-fund
          else
            echo 'BOOTSTRAP ONLY: no lockfile committed; installing to produce one for review.'
            npm install --no-audit --no-fund
          fi
      - name: Export lockfile for follow-up review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-sara-package-lock-candidate
          path: package-lock.json
          if-no-files-found: warn
      - name: TypeScript
        run: npm run typecheck
      - name: Production Build
        run: npm run build
      - name: Commit generated lockfile to integration branch only
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/phase7-integration'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Committed package-lock.json already exists."
            exit 0
          fi
          test -s package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m "build: lock verified BY SARA dependency resolution"
          git push origin HEAD:refs/heads/phase7-integration
      - name: Save build trace (no secrets)
        if: failure()
        run: echo 'Check this workflow logs. Do not upload .env files.'
