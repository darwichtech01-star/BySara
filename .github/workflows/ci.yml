name: BY SARA — Quality Gates
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: by-sara-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    name: Dependency-free source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:repository
      - run: npm test
  build:
    name: Lockfile, TypeScript and Next.js build
    needs: source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Production Build
        run: npm run build
      - name: Save build trace (no secrets)
        if: failure()
        run: echo 'Check this workflow logs. Do not upload .env files.'
